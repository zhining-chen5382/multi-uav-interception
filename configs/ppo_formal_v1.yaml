env_config: interception_1v1.yaml
device: cpu
torch_num_threads: 1
acceptance:
  smoke_pause_steps: 10000
  smoke_stop_steps: 12288
experiment:
  output_root: outputs/formal_ppo_v1/v14_单机PPO_原始奖励/01_从零训练至300k
  seeds: [1001, 1002, 1003, 1004, 1005]
  validation_seed: 2001
  test_seed: 3001
  test_episodes: 500
  reference_angle_degrees: 0.0
  angle_bins_degrees: [-30.0, -20.0, -10.0, 0.0, 10.0, 20.0, 30.0]
network:
  actor_hidden_sizes: [128, 128]
  critic_hidden_sizes: [128, 128]
  initial_std: 0.5
  min_log_std: -5.0
  max_log_std: 0.0
  hidden_gain: 1.4142135623730951
  actor_output_gain: 0.01
  critic_output_gain: 1.0
ppo:
  actor_learning_rate: 0.0003
  actor_final_learning_rate: 0.00003
  critic_learning_rate: 0.001
  critic_final_learning_rate: 0.0001
  adam_betas: [0.9, 0.999]
  adam_epsilon: 0.00001
  weight_decay: 0.0
  amsgrad: false
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  update_epochs: 4
  minibatch_size: 256
  target_kl: 0.015
  entropy_coefficient: 0.01
  value_loss_coefficient: 0.5
  max_grad_norm: 0.5
  advantage_normalization: true
  normalization_epsilon: 0.00000001
  value_clipping: false
  value_normalization: false
training:
  total_env_steps: 300000
  num_envs: 8
  rollout_steps: 512
  evaluation_interval_steps: 10000
  validation_episodes: 100
  stability_threshold: 0.8
  stability_consecutive: 3
  checkpoint_interval_updates: 1
