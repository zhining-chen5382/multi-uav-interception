# Relative to this file; physical parameters remain in the environment YAML.
env_config: baseline_3a1c.yaml
seed: 0
device: cpu
torch_num_threads: 1
# Relative to the repository root; use --output-dir for separate runs.
output_dir: outputs

training:
  total_env_steps: 100000
  rollout_steps: 512
  log_interval_updates: 1
  checkpoint_interval_updates: 10
  capture_rate_window: 50

network:
  actor_hidden_sizes: [128, 128]
  critic_hidden_sizes: [256, 256]
  # Hidden layers use Tanh; actor output is the Gaussian mean before squashing.
  initial_log_std: -0.5
  min_log_std: -5.0
  max_log_std: 2.0
  hidden_gain: 1.4142135623730951
  actor_output_gain: 0.01
  critic_output_gain: 1.0

ppo:
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.001
  adam_epsilon: 0.00001
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  update_epochs: 4
  # Number of team timesteps per minibatch: 64 * 3 actor samples, 64 values.
  minibatch_size: 64
  entropy_coefficient: 0.01
  value_loss_coefficient: 0.5
  max_grad_norm: 0.5
  advantage_normalization: true
  normalization_epsilon: 0.00000001

normalization:
  # Optional fixed scaling derived from environment bounds/speed limits.
  # These switches do not change the environment's raw 21D/24D interfaces.
  observation: false
  global_state: false
  # Explicit constant scaling for learning only; CSV rewards remain raw.
  # No running reward normalization is applied.
  reward_scale: 1.0

evaluation:
  episodes: 10
  seed: 1000

visualization:
  seed: 1000
  dpi: 160
  figure_size: [10, 8]
