# Same-run continuation to 300k TOTAL; source final/optimizers/RNG restored.
env_config: baseline_3a1c.yaml
seed: 0
device: cpu
torch_num_threads: 1
output_dir: outputs/v06_输入归一化/v06-r01_20261108_seed000/continuation_300k
training:
  total_env_steps: 300000
  rollout_steps: 512
  log_interval_updates: 1
  checkpoint_interval_updates: 10
  capture_rate_window: 50
network:
  actor_hidden_sizes:
  - 128
  - 128
  critic_hidden_sizes:
  - 256
  - 256
  initial_log_std: -0.5
  min_log_std: -5.0
  max_log_std: 2.0
  hidden_gain: 1.4142135623730951
  actor_output_gain: 0.01
  critic_output_gain: 1.0
ppo:
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.001
  adam_epsilon: 1.0e-05
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  update_epochs: 4
  minibatch_size: 64
  entropy_coefficient: 0.01
  value_loss_coefficient: 0.5
  max_grad_norm: 0.5
  advantage_normalization: true
  normalization_epsilon: 1.0e-08
normalization:
  observation: true
  global_state: true
  reward_scale: 1.0
evaluation:
  episodes: 10
  seed: 1000
visualization:
  seed: 1000
  dpi: 160
  figure_size:
  - 10
  - 8
